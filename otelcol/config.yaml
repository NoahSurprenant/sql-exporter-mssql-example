# OpenTelemetry Collector (contrib) with the sql_server receiver: the expensive queries and stored
# procedures, their execution plans and definitions, and what is running right now, as log events.
# The detail sql_exporter's metrics can't carry (full query text, plan XML) goes here; in a real
# deployment the logs pipeline would export to Loki or another log store instead of a file.
#
# Like sql_exporter, the receiver pulls: it logs in to SQL Server and queries its DMVs on a timer.
# It reports deltas: the first collection only records a baseline, so a query or procedure appears
# from the second collection on, if it ran again in between.
#
# Settings come from the environment, so compose.yaml and the Windows job share this file:
#   SQLSERVER_DATASOURCE  connection URL, as the otel_collector login (sql/setup.sql)
#   EVENTS_FILE           where the events are written, one OTLP/JSON batch per line
#
# Deadlock graphs come from a second receiver, sql_query/deadlocks, as db.server.deadlock events.
receivers:
  sql_server:
    datasource: ${env:SQLSERVER_DATASOURCE}
    # Short for the example, so the test sees events quickly; the defaults are 10s and 60s.
    collection_interval: 10s
    events:
      db.server.top_query:
        enabled: true
      # The plan on its own record (joined back by sqlserver.query_hash + sqlserver.query_plan_hash),
      # so an oversized plan can't drop the query statistics with it.
      db.server.query_plan:
        enabled: true
      db.server.top_procedure:
        enabled: true
      db.server.procedure_definition:
        enabled: true
      db.server.query_sample:
        enabled: true
    top_query_collection:
      collection_interval: 10s
      lookback_time: 120s
      top_query_count: 50
    top_procedure_collection:
      collection_interval: 10s
      top_procedure_count: 50

  # Deadlock graphs. SQL Server's always-on system_health session records every deadlock as an
  # xml_deadlock_report event in its event files; this reads the ones newer than the last it saw
  # (tracking_column), so each arrives once. Needs VIEW SERVER STATE.
  sql_query/deadlocks:
    driver: sqlserver
    datasource: ${env:SQLSERVER_DATASOURCE}
    collection_interval: 10s
    queries:
      - sql: |
          SELECT CONVERT(varchar(27), x.timestamp_utc, 126) AS event_time,
                 CONVERT(nvarchar(max), x.event_data) AS deadlock_graph
          FROM sys.fn_xe_file_target_read_file(N'system_health*.xel', NULL, NULL, NULL) AS x
          WHERE x.object_name = N'xml_deadlock_report'
            AND CONVERT(varchar(27), x.timestamp_utc, 126) > @p1
          ORDER BY event_time
        tracking_column: event_time
        tracking_start_value: "2000-01-01T00:00:00"
        logs:
          - body_column: deadlock_graph

processors:
  batch: {}
  # sql_query records carry no event name; give the deadlocks one, as the sql_server events have.
  transform/deadlocks:
    error_mode: ignore
    log_statements:
      - statements:
          - set(log.event_name, "db.server.deadlock") where log.event_name == ""

exporters:
  file:
    path: ${env:EVENTS_FILE}
  debug:
    verbosity: basic

service:
  pipelines:
    # Logs only: sql_exporter already covers the metrics, so the receiver's are left out.
    logs:
      receivers: [sql_server, sql_query/deadlocks]
      processors: [transform/deadlocks, batch]
      exporters: [file, debug]
