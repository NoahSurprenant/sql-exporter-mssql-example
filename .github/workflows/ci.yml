name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, so a new SQL Server cumulative update that changes a DMV shows up without a commit.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Throwaway passwords for the runners' own SQL Server instances.
  MSSQL_SA_PASSWORD: Example.Sa.Passw0rd
  EXPORTER_PASSWORD: Example.Exporter.Passw0rd
  SQL_EXPORTER_VERSION: 0.24.13
  # The Windows job's collector binary; compose.yaml pins the same version's image.
  OTELCOL_VERSION: 0.165.0

jobs:
  # mssql_standard is upstream's example collector, kept byte-for-byte: it ships in neither the
  # binary nor the image, so a copy is the only way to use it. Fails when the copy differs from the
  # file at the pinned exporter version, so bumping SQL_EXPORTER_VERSION surfaces upstream changes.
  upstream-collector:
    name: mssql_standard matches upstream
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare with sql_exporter's examples/mssql at SQL_EXPORTER_VERSION
        run: |
          curl -fsSL "https://raw.githubusercontent.com/burningalchemist/sql_exporter/$SQL_EXPORTER_VERSION/examples/mssql/mssql_standard.collector.yml" \
            | diff -u - collectors/mssql_standard.collector.yml

  linux:
    name: Linux container, SQL Server ${{ matrix.version }}
    runs-on: ubuntu-24.04
    # The 2022 job on main also collects for 15 minutes for the Pages site.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        version: ["2017", "2019", "2022", "2025"]
    env:
      MSSQL_VERSION: ${{ matrix.version }}
      # See compose.yaml: 2017 images can generate a certificate Go refuses.
      EXPORTER_GODEBUG: ${{ matrix.version == '2017' && 'x509negativeserial=1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start SQL Server, setup and sql_exporter
        run: docker compose up -d

      # A 20-second blocking chain, a deadlock and a failed login (sql/contention), for the blocking,
      # deadlock and error-log checks.
      - name: Contention
        run: docker compose run --rm -T setup contention

      - name: Check every collector query
        run: python3 tests/check_metrics.py

      # sudo: the collector container writes out/ as root.
      - name: Check the OpenTelemetry events
        run: sudo -E python3 tests/check_events.py --events out/events.jsonl --workload "docker compose run --rm -T setup workload"

      # Every dashboard panel through Grafana's query API: Prometheus scraping sql_exporter, Loki
      # holding the collector's events.
      - name: Check Grafana
        run: python3 tests/check_grafana.py

      - name: Screenshot the dashboard
        run: |
          # The image has the browsers but not the Python package, so it is installed first, at the
          # image's version; the screenshot is handed back to the runner's user.
          docker run --rm --network host -v "$PWD:/w" -w /w \
            mcr.microsoft.com/playwright/python:v1.65.0-noble@sha256:f9294526294a7bdfb8ca8aa7d815c049125a10e73b65d47fb9a80f5d74f284a6 \
            sh -c "pip install -q --break-system-packages playwright==1.65.0 &&
                   python tests/screenshot.py http://localhost:3000 grafana-${{ matrix.version }}.png &&
                   chown $(id -u):$(id -g) grafana-${{ matrix.version }}.png"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grafana-${{ matrix.version }}
          path: grafana-${{ matrix.version }}.png

      # The GitHub Pages site (pages/): Grafana's own web app showing a snapshot of the dashboard, with
      # its few API calls answered from a recording, so it needs no server. Built from the 2022 job.
      # The snapshot covers 15 minutes (pages/snapshot.py), so fill them: the workload every 10-40
      # seconds, uneven so the graphs show some shape. Only when the site is published.
      - name: Collect for the Pages site
        if: matrix.version == '2022' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          end=$((SECONDS + 15 * 60))
          i=0
          while [ $SECONDS -lt $end ]; do
            docker compose run --rm -T setup workload > /dev/null
            # Blocking and a deadlock every few rounds, in the background.
            if [ $((i++ % 4)) -eq 0 ]; then docker compose run --rm -T setup contention > /dev/null & fi
            sleep $((RANDOM % 31 + 10))
          done
          wait

      - name: Build the Pages site
        if: matrix.version == '2022'
        run: |
          docker compose -f compose.yaml -f pages/compose.pages.yaml up -d grafana
          base=http://localhost:3000/sql-exporter-mssql-example
          for i in $(seq 60); do curl -sf "$base/api/health" > /dev/null && break; sleep 2; done
          mkdir -p _site
          docker compose cp grafana:/usr/share/grafana/public _site/
          find _site/public -name '*.map' -delete
          # Publishes the snapshot (the last 15 minutes) and records it.
          docker run --rm --network host -v "$PWD:/w" -w /w mcr.microsoft.com/playwright/python:v1.65.0-noble@sha256:f9294526294a7bdfb8ca8aa7d815c049125a10e73b65d47fb9a80f5d74f284a6 \
            sh -c "pip install -q --break-system-packages playwright==1.65.0 &&
                   python pages/record.py $base 15 _site && chown -R $(id -u):$(id -g) _site"
          key=$(cat _site/key.txt) && rm _site/key.txt
          cp pages/sw.js _site/
          python3 pages/build.py _site "$key"
          du -sh _site

      # The site with Grafana stopped and only static files behind it, as GitHub Pages serves it.
      - name: Check the Pages site
        if: matrix.version == '2022'
        run: |
          docker compose stop grafana
          mkdir -p serve && ln -sfn ../_site serve/sql-exporter-mssql-example
          (cd serve && python3 ../pages/pages_server.py 8099 > /dev/null 2>&1 &)
          docker run --rm --network host -v "$PWD:/w" -w /w mcr.microsoft.com/playwright/python:v1.65.0-noble@sha256:f9294526294a7bdfb8ca8aa7d815c049125a10e73b65d47fb9a80f5d74f284a6 \
            sh -c "pip install -q --break-system-packages playwright==1.65.0 &&
                   python pages/check_site.py http://localhost:8099/sql-exporter-mssql-example/ pages-site.png &&
                   chown $(id -u):$(id -g) pages-site.png"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.version == '2022'
        with:
          name: pages-site
          path: pages-site.png

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: matrix.version == '2022' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: _site

      - name: Server version
        if: always()
        run: |
          docker compose exec -T mssql bash -c \
            's=/opt/mssql-tools18/bin/sqlcmd; [ -x $s ] || s=/opt/mssql-tools/bin/sqlcmd;
             $s -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -h -1 -Q "SET NOCOUNT ON; SELECT @@VERSION"' \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Logs
        if: failure()
        run: docker compose logs

  windows:
    name: Windows, SQL Server ${{ matrix.version }}, exporter on ${{ matrix.exporter == 'wsl2' && 'Docker on Linux (WSL 2)' || 'Windows' }}
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        version: ["2017", "2019", "2022", "2025"]
        # windows: the Windows build of sql_exporter on the same machine, over localhost.
        # wsl2: the sql_exporter container, on Docker Engine in WSL 2 (a Linux VM with its own kernel
        # and address), reaching SQL Server over the virtual network and through the Windows
        # firewall: a Linux Docker host scraping a Windows database server.
        exporter: [windows, wsl2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A real SQL Server installation on Windows (Developer edition, default instance on
      # localhost:1433, mixed-mode authentication), not a container. RTM, no cumulative update: for
      # 2017 that is before CU3, so the collector's procedure events are skipped there.
      - name: Install SQL Server ${{ matrix.version }}
        uses: potatoqualitee/mssqlsuite@bc850f242e5fe551e36cea6fa4bed608c58fa489 # v2
        with:
          install: sqlengine
          version: ${{ matrix.version }}
          sa-password: ${{ env.MSSQL_SA_PASSWORD }}

      - name: Create the exporter login, example database and workload
        shell: pwsh
        run: |
          sqlcmd -S localhost -U sa -P $env:MSSQL_SA_PASSWORD -C -b -i sql/setup.sql -v "EXPORTER_PASSWORD=$env:EXPORTER_PASSWORD"
          if ($LASTEXITCODE -ne 0) { throw "setup.sql failed" }
          # Not -b: the workload ends with a deliberate error.
          sqlcmd -S localhost -U sa -P $env:MSSQL_SA_PASSWORD -C -i sql/workload.sql | Out-Null
          sqlcmd -S localhost -U sa -P $env:MSSQL_SA_PASSWORD -C -h -1 -Q "SET NOCOUNT ON; SELECT @@VERSION" |
            Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY
          # A blocking chain and a deadlock, for the deadlock checks.
          ./sql/contention/run.ps1
          $global:LASTEXITCODE = 0

      - name: Download sql_exporter for Windows
        if: matrix.exporter == 'windows'
        shell: pwsh
        run: |
          $v = $env:SQL_EXPORTER_VERSION
          $base = "https://github.com/burningalchemist/sql_exporter/releases/download/$v"
          $zip = "sql_exporter-$v.windows-amd64.zip"
          Invoke-WebRequest "$base/$zip" -OutFile "$env:RUNNER_TEMP/$zip"
          Invoke-WebRequest "$base/sha256sums.txt" -OutFile "$env:RUNNER_TEMP/sha256sums.txt"
          $expected = ((Get-Content "$env:RUNNER_TEMP/sha256sums.txt" | Where-Object { $_ -match [regex]::Escape($zip) }) -split '\s+')[0]
          $actual = (Get-FileHash "$env:RUNNER_TEMP/$zip" -Algorithm SHA256).Hash
          if (-not $expected -or $actual -ne $expected.ToUpper()) { throw "checksum mismatch: $actual vs $expected" }
          Expand-Archive "$env:RUNNER_TEMP/$zip" -DestinationPath "$env:RUNNER_TEMP/sql_exporter"

      - name: Run sql_exporter and check every collector query
        if: matrix.exporter == 'windows'
        shell: pwsh
        run: |
          $exe = (Get-ChildItem "$env:RUNNER_TEMP/sql_exporter" -Recurse -Filter sql_exporter.exe | Select-Object -First 1).FullName
          $dsn = "sqlserver://sql_exporter:$($env:EXPORTER_PASSWORD)@localhost:1433?encrypt=true&trustservercertificate=true"
          $exporter = Start-Process $exe -PassThru -NoNewWindow `
            -ArgumentList "--config.file=sql_exporter.yml", "--config.data-source-name=$dsn" `
            -RedirectStandardError "$env:RUNNER_TEMP/sql_exporter.log"
          try {
            python tests/check_metrics.py
            if ($LASTEXITCODE -ne 0) { throw "metric check failed" }
          } finally {
            Stop-Process -Id $exporter.Id -ErrorAction SilentlyContinue
            Get-Content "$env:RUNNER_TEMP/sql_exporter.log" -ErrorAction SilentlyContinue
          }

      - name: Run the OpenTelemetry Collector for Windows and check its events
        if: matrix.exporter == 'windows'
        shell: pwsh
        run: |
          $v = $env:OTELCOL_VERSION
          $tarball = "otelcol-contrib_${v}_windows_amd64.tar.gz"
          $base = "https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v$v"
          Invoke-WebRequest "$base/$tarball" -OutFile "$env:RUNNER_TEMP/$tarball"
          Invoke-WebRequest "$base/$tarball.sha256" -OutFile "$env:RUNNER_TEMP/$tarball.sha256"
          $expected = ((Get-Content "$env:RUNNER_TEMP/$tarball.sha256" -Raw).Trim() -split '\s+')[0]
          $actual = (Get-FileHash "$env:RUNNER_TEMP/$tarball" -Algorithm SHA256).Hash
          if (-not $expected -or $actual -ne $expected.ToUpper()) { throw "checksum mismatch: $actual vs $expected" }
          New-Item -ItemType Directory "$env:RUNNER_TEMP/otelcol" | Out-Null
          tar -xzf "$env:RUNNER_TEMP/$tarball" -C "$env:RUNNER_TEMP/otelcol"
          $exe = (Get-ChildItem "$env:RUNNER_TEMP/otelcol" -Recurse -Filter otelcol-contrib.exe | Select-Object -First 1).FullName

          $env:SQLSERVER_DATASOURCE = "sqlserver://otel_collector:$($env:EXPORTER_PASSWORD)@localhost:1433?encrypt=true&trustservercertificate=true"
          $env:EVENTS_FILE = "$env:RUNNER_TEMP/events.jsonl"
          $collector = Start-Process $exe -PassThru -NoNewWindow -ArgumentList "--config=otelcol/config.yaml" `
            -RedirectStandardError "$env:RUNNER_TEMP/otelcol.log"
          try {
            python tests/check_events.py --events $env:EVENTS_FILE `
              --workload "sqlcmd -S localhost -U sa -P ${{ env.MSSQL_SA_PASSWORD }} -C -i sql/workload.sql" `
              ${{ matrix.version == '2017' && '--no-procedures' || '' }}
            if ($LASTEXITCODE -ne 0) { throw "event check failed" }
          } finally {
            Stop-Process -Id $collector.Id -ErrorAction SilentlyContinue
            Get-Content "$env:RUNNER_TEMP/otelcol.log" -Tail 50 -ErrorAction SilentlyContinue
          }

      - name: Install WSL 2 with Ubuntu
        if: matrix.exporter == 'wsl2'
        uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          additional-packages: docker.io curl ca-certificates python3 iproute2

      # WSL 2 is a separate network: its connections arrive on the host's WSL virtual adapter, not
      # loopback, so the firewall has to let them in.
      - name: Allow SQL Server through the Windows firewall
        if: matrix.exporter == 'wsl2'
        shell: pwsh
        run: New-NetFirewallRule -DisplayName "SQL Server (WSL 2)" -Direction Inbound -Protocol TCP -LocalPort 1433 -Action Allow | Out-Null

      # One step, so Docker, the exporter and the check share a WSL session: WSL can stop the VM once
      # nothing is attached to it. Workflow env is not passed into WSL, hence the expressions.
      - name: Run sql_exporter and the OpenTelemetry Collector on Docker in WSL 2 and check them
        if: matrix.exporter == 'wsl2'
        shell: wsl-bash {0}
        run: |
          uname -sr
          cd "$(wslpath '${{ github.workspace }}')"

          # No systemd in the distribution, so the daemon is started by hand.
          dockerd > /tmp/dockerd.log 2>&1 &
          for i in $(seq 60); do docker info > /dev/null 2>&1 && break; sleep 1; done
          docker info > /dev/null 2>&1 || { cat /tmp/dockerd.log; exit 1; }
          docker version --format 'Docker {{.Server.Version}} on {{.Server.Os}}/{{.Server.Arch}}'

          # The Windows host, as WSL 2 sees it: its default gateway. The container reaches it through
          # Docker's bridge, NATed by the WSL VM.
          host=$(ip route show default | awk '{print $3; exit}')
          echo "SQL Server at $host:1433"

          # The same image compose.yaml runs, by digest (CR stripped: Windows checkouts are CRLF).
          image=$(grep -oE 'burningalchemist/sql_exporter:[^ ]+' compose.yaml | tr -d '\r')
          docker run -d --name sql-exporter -p 9399:9399 \
            -v "$PWD/sql_exporter.yml:/etc/sql_exporter/sql_exporter.yml:ro" \
            -v "$PWD/collectors:/etc/sql_exporter/collectors:ro" \
            "$image" --config.file=/etc/sql_exporter/sql_exporter.yml \
            "--config.data-source-name=sqlserver://sql_exporter:${{ env.EXPORTER_PASSWORD }}@$host:1433?encrypt=true&trustservercertificate=true"
          trap 'docker logs sql-exporter; docker rm -f sql-exporter > /dev/null' EXIT
          python3 tests/check_metrics.py

          # The collector container too, the same image as compose.yaml. The workload reruns through
          # the Windows sqlcmd (WSL interop), against the Windows SQL Server.
          collector_image=$(grep -oE 'otel/opentelemetry-collector-contrib:[^ ]+' compose.yaml | tr -d '\r')
          mkdir -p /tmp/out
          docker run -d --name otel-collector -v /tmp/out:/out --user 0:0 \
            -v "$PWD/otelcol/config.yaml:/etc/otelcol/config.yaml:ro" \
            -e "SQLSERVER_DATASOURCE=sqlserver://otel_collector:${{ env.EXPORTER_PASSWORD }}@$host:1433?encrypt=true&trustservercertificate=true" \
            -e EVENTS_FILE=/out/events.jsonl \
            "$collector_image" --config=/etc/otelcol/config.yaml
          trap 'docker logs sql-exporter; docker logs --tail 50 otel-collector; docker rm -f sql-exporter otel-collector > /dev/null' EXIT
          python3 tests/check_events.py --events /tmp/out/events.jsonl \
            --workload "sqlcmd.exe -S localhost -U sa -P '${{ env.MSSQL_SA_PASSWORD }}' -C -i '$(wslpath -w sql/workload.sql)'" \
            ${{ matrix.version == '2017' && '--no-procedures' || '' }}

  pages:
    name: Deploy the Pages site
    needs: linux
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
