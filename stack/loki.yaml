# Single-process Loki on local disk, for the example only. OTLP ingestion (/otlp) is on by default.
auth_enabled: false

server:
  http_listen_port: 3100
  # Execution plans are tens of KB each: a query over a few hundred passes the 4 MB gRPC default
  # between Loki's own components and fails ("received message larger than max").
  grpc_server_max_recv_msg_size: 67108864
  grpc_server_max_send_msg_size: 67108864

frontend_worker:
  grpc_client_config:
    max_send_msg_size: 67108864

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  # Plans run to tens of KB of XML; well under the default 256 KB line limit, set here to be explicit.
  max_line_size: 1MB

analytics:
  reporting_enabled: false
